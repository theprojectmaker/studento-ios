# Drives Studento on a simulator and saves App Store screenshots (run from the output folder).
appId: com.solyapps.studento
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# ---- First-launch setup wizard ----
- extendedWaitUntil:
    visible: "Get started"
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: 01-welcome
- tapOn: "Get started"

- extendedWaitUntil:
    visible: "What school do you go to?"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Great Neck North.*"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 02-school
- tapOn:
    text: ".*Great Neck North.*"
    optional: true

- extendedWaitUntil:
    visible: "Which bell schedule?"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 03-bell-schedule
- tapOn:
    text: "Next"
    optional: true

- extendedWaitUntil:
    visible: "Your classes"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 04-classes
- tapOn:
    text: "Skip.*"
    optional: true

- extendedWaitUntil:
    visible: "Bell alerts"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 05-bell-alerts
- tapOn:
    text: "Not now"
    optional: true

- extendedWaitUntil:
    visible: "Pick a look"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 06-pick-a-look
- tapOn:
    text: "Next"
    optional: true

- extendedWaitUntil:
    visible: "Save your schedule across devices"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 07-account
- tapOn:
    text: "Skip for now"
    optional: true

- extendedWaitUntil:
    visible: "All set"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 08-all-set
- tapOn:
    text: "Open the clock"
    optional: true

# ---- Turn on the Period 3 demo so the clock shows a class countdown ----
- openLink: studento://settings
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Pretend it's Period 3"
    direction: DOWN
    timeout: 30000
    optional: true
- tapOn:
    text: "Pretend it's Period 3"
    optional: true
- waitForAnimationToEnd

# ---- The clock ----
- openLink: studento://
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*Period 3.*"
    timeout: 15000
    optional: true
- takeScreenshot: 09-clock

# ---- Themes ----
- openLink: studento://themes
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 10-themes
- tapOn:
    text: "Jackpot"
    optional: true
- openLink: studento://
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 11-clock-jackpot

- openLink: studento://themes
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Gatsby"
    optional: true
- openLink: studento://
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 12-clock-gatsby

# ---- Settings ----
- openLink: studento://settings
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 13-settings
