appId: com.solyapps.studento
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# ---- First-launch setup wizard ----
- extendedWaitUntil:
    visible: "Get started"
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: 01-welcome
- tapOn: "Get started"

- extendedWaitUntil:
    visible: "What school do you go to?"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Great Neck North.*"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 02-school
- tapOn:
    text: ".*Great Neck North.*"
    optional: true

- extendedWaitUntil:
    visible: "Which bell schedule?"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 03-bell-schedule
- tapOn:
    text: "Next"
    optional: true

- extendedWaitUntil:
    visible: "Your classes"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 04-classes
- tapOn:
    text: "Skip.*"
    optional: true

- extendedWaitUntil:
    visible: "Bell alerts"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 05-bell-alerts
- tapOn:
    text: "Not now"
    optional: true

- extendedWaitUntil:
    visible: "Pick a look"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 06-pick-a-look
- tapOn:
    text: "Next"
    optional: true

- extendedWaitUntil:
    visible: "Save your schedule across devices"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 07-account
- tapOn:
    text: "Skip for now"
    optional: true

- extendedWaitUntil:
    visible: "All set"
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 08-all-set
- tapOn:
    text: "Open the clock"
    optional: true

