# Studento's small server: Cloudflare Pages + Functions + D1 at https://studento-app.pages.dev
# Deploy from this folder:  npx wrangler@4.128.0 pages deploy public --project-name studento-app
# (pin 4.128.0: newer wrangler turns `pages project create` into a Worker on a drifting workers.dev name)
# Secrets (never in the repo): npx wrangler@4.128.0 pages secret put GEMINI_API_KEY --project-name studento-app
name = "studento-app"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "studento-db"
database_id = "405a1934-2102-4c31-ae37-d1789aabfedd"

[ai]
binding = "AI"
