<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Beam call</title>
<style>
  :root { --bg: #0a0a0b; --ink: #f2eee6; --accent: #e8b84b; --muted: rgba(242,238,230,.6); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  #remote { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; opacity: 0; transition: opacity .3s; }
  #remote.on { opacity: 1; }
  #local { position: fixed; top: calc(env(safe-area-inset-top) + 16px); right: 16px; width: 104px; height: 148px; border-radius: 16px; object-fit: cover; background: #111; box-shadow: 0 8px 24px rgba(0,0,0,.45); transform: scaleX(-1); display: none; }
  #local.on { display: block; }
  .stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; transition: opacity .3s; }
  .stage.hide { opacity: 0; pointer-events: none; }
  .avatar { width: 120px; height: 120px; border-radius: 60px; background: var(--accent); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 800; position: relative; }
  .avatar.ring::after { content: ""; position: absolute; inset: -10px; border-radius: 70px; border: 2px solid var(--accent); opacity: .5; animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { from { transform: scale(.92); opacity: .6; } to { transform: scale(1.25); opacity: 0; } }
  .brand { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; }
  .name { font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
  .status { font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .top { position: fixed; top: calc(env(safe-area-inset-top) + 18px); left: 0; right: 0; text-align: center; pointer-events: none; display: none; }
  .top.on { display: block; }
  .top .name { font-size: 20px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .top .status { font-size: 14px; color: rgba(255,255,255,.8); text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .bar { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 28px); display: flex; justify-content: center; gap: 22px; }
  .btn { width: 64px; height: 64px; border-radius: 32px; border: 0; background: rgba(255,255,255,.14); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .btn svg { width: 26px; height: 26px; }
  .btn.off { background: #f2f2f2; color: #111; }
  .btn.end { background: #ff3b30; }
  .btn.end svg { transform: rotate(135deg); }
  .btn[hidden] { display: none; }
  .label { font-size: 11px; color: var(--muted); margin-top: 6px; text-align: center; }
  .col { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
<video id="remote" autoplay playsinline></video>
<video id="local" autoplay playsinline muted></video>

<div class="stage" id="stage">
  <div class="brand">Beam</div>
  <div class="avatar ring" id="avatar">?</div>
  <div class="name" id="name">…</div>
  <div class="status" id="status">Starting…</div>
</div>
<div class="top" id="top"><div class="name" id="topName"></div><div class="status" id="topStatus"></div></div>

<div class="bar">
  <div class="col"><button class="btn" id="mute" aria-label="Mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><div class="label">mute</div></div>
  <div class="col" id="camCol"><button class="btn" id="cam" aria-label="Camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="13" height="11" rx="2.5"/><path d="M15.5 10.5 21 7.5v9l-5.5-3"/></svg></button><div class="label">camera</div></div>
  <div class="col" id="flipCol"><button class="btn" id="flip" aria-label="Flip camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><path d="M9.5 13.5a2.5 2.5 0 0 0 4.6 1.3M14.5 12.5a2.5 2.5 0 0 0-4.6-1.3"/></svg></button><div class="label">flip</div></div>
  <div class="col"><button class="btn end" id="end" aria-label="End call"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg></button><div class="label">end</div></div>
</div>

<script>
(() => {
  // Params come in the hash (hosted page) or window.__P (the app loads this page inline).
  const P = window.__P || Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  // Bridge mode (the app): every API call is answered by the app from Firestore, so this page
  // never needs to reach a server itself. Hosted mode (no bridge) still uses fetch.
  const BRIDGE = !!window.ReactNativeWebView || (P.bridge === '1' && window.parent !== window);
  let bridgeSeq = 0;
  const waiting = {};
  window.__apiReply = (id, ok, data) => { const w = waiting[id]; if (!w) return; delete waiting[id]; ok ? w.res(data) : w.rej(new Error((data && data.error) || 'failed')); };
  window.addEventListener('message', (e) => { try { const m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; if (m && m.type === 'apiReply') window.__apiReply(m.id, m.ok, m.data); } catch {} });
  const bridgeApi = (path, opts) => new Promise((res, rej) => {
    const id = ++bridgeSeq;
    waiting[id] = { res, rej };
    const msg = JSON.stringify({ type: 'api', id, path, method: opts.method || 'GET', body: opts.body });
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg); else window.parent.postMessage(msg, '*');
    setTimeout(() => { if (waiting[id]) { delete waiting[id]; rej(new Error('timeout')); } }, 20000);
  });
  const API = P.api || location.origin;
  const token = P.token || '';
  const callId = Number(P.call || 0);
  const role = P.role === 'callee' ? 'callee' : 'caller';
  let video = P.video === '1';
  const peer = P.peer || '';
  for (const k of ['bg', 'ink', 'accent']) if (/^#[0-9a-fA-F]{3,8}$/.test(P[k] || '')) document.documentElement.style.setProperty('--' + k, P[k]);
  if (P.ink && /^#[0-9a-fA-F]{6}$/.test(P.ink)) document.documentElement.style.setProperty('--muted', P.ink + '99');

  const $ = (id) => document.getElementById(id);
  $('name').textContent = peer || 'Beam';
  $('topName').textContent = peer;
  $('avatar').textContent = (peer[0] || '?').toUpperCase();
  if (!video) { $('camCol').hidden = true; $('flipCol').hidden = true; }

  let pc = null, local = null, after = 0, timer = null, startedAt = 0, done = false, facing = 'user', gotRemote = false;
  const pendingIce = [];

  const say = (t) => { $('status').textContent = t; $('topStatus').textContent = t; };
  const api = async (path, opts = {}) => {
    if (BRIDGE) return bridgeApi(path, opts);
    const r = await fetch(API + path, { method: opts.method || 'GET', headers: { Authorization: 'Bearer ' + token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  };
  const signal = (kind, data) => api(`/api/calls/${callId}/signal`, { method: 'POST', body: { kind, data } }).catch(() => {});
  const close = (why) => {
    if (done) return;
    done = true;
    say(why || 'Call ended');
    $('avatar').classList.remove('ring');
    try { pc && pc.close(); } catch {}
    try { local && local.getTracks().forEach((t) => t.stop()); } catch {}
    clearInterval(timer);
    const msg = JSON.stringify({ type: 'close' });
    setTimeout(() => {
      if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
      else if (window.parent !== window) window.parent.postMessage(msg, '*');
    }, 900);
  };
  const tick = () => {
    const s = Math.floor((Date.now() - startedAt) / 1000);
    say(`${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`);
  };
  const connected = () => {
    if (startedAt) return;
    startedAt = Date.now();
    $('avatar').classList.remove('ring');
    tick();
    timer = setInterval(tick, 1000);
  };

  async function start() {
    if (!token || !callId) return close('Missing call details');
    say(role === 'caller' ? 'Calling…' : 'Connecting…');
    try {
      local = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: video ? { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } } : false });
    } catch (e) {
      return close(video ? 'Camera or microphone blocked' : 'Microphone blocked');
    }
    if (video) { $('local').srcObject = local; $('local').classList.add('on'); }
    let ice = [{ urls: 'stun:stun.l.google.com:19302' }];
    try { ice = (await api('/api/ice')).iceServers; } catch {}
    pc = new RTCPeerConnection({ iceServers: ice });
    local.getTracks().forEach((t) => pc.addTrack(t, local));
    pc.onicecandidate = (e) => { if (e.candidate) signal('ice', e.candidate.toJSON ? e.candidate.toJSON() : e.candidate); };
    pc.ontrack = (e) => {
      const stream = e.streams[0] || new MediaStream([e.track]);
      const el = $('remote');
      if (el.srcObject !== stream) el.srcObject = stream;
      gotRemote = true;
      if (e.track.kind === 'video') { el.classList.add('on'); $('stage').classList.add('hide'); $('top').classList.add('on'); }
    };
    pc.onconnectionstatechange = () => {
      const st = pc.connectionState;
      if (st === 'connected') connected();
      if (st === 'failed') close('Could not connect');
    };
    pc.oniceconnectionstatechange = () => { if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') connected(); };
    if (role === 'caller') {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await signal('offer', { type: offer.type, sdp: offer.sdp });
    }
    poll();
  }

  async function handle(sig) {
    if (sig.kind === 'offer' && role === 'callee') {
      await pc.setRemoteDescription(sig.data);
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      await signal('answer', { type: ans.type, sdp: ans.sdp });
      while (pendingIce.length) await pc.addIceCandidate(pendingIce.shift()).catch(() => {});
    } else if (sig.kind === 'answer' && role === 'caller') {
      await pc.setRemoteDescription(sig.data);
      say('Connecting…');
      while (pendingIce.length) await pc.addIceCandidate(pendingIce.shift()).catch(() => {});
    } else if (sig.kind === 'ice' && sig.data) {
      if (pc.remoteDescription) await pc.addIceCandidate(sig.data).catch(() => {});
      else pendingIce.push(sig.data);
    }
  }

  async function poll() {
    while (!done) {
      try {
        const r = await api(`/api/calls/${callId}/signal?after=${after}`);
        for (const s of r.signals) { after = Math.max(after, s.id); await handle(s); }
        if (r.status === 'declined') return close(`${peer} is busy`);
        if (r.status === 'missed') return close('No answer');
        if (r.status === 'ended') return close('Call ended');
        if (r.status === 'ringing' && role === 'caller' && !gotRemote) say('Ringing…');
      } catch (e) {
        if (String(e.message).includes('over') || String(e.message).includes('No such')) return close('Call ended');
      }
      await new Promise((res) => setTimeout(res, startedAt ? 2000 : 700));
    }
  }

  $('end').onclick = () => { api(`/api/calls/${callId}/end`, { method: 'POST' }).catch(() => {}); close('Call ended'); };
  $('mute').onclick = () => {
    const t = local && local.getAudioTracks()[0];
    if (!t) return;
    t.enabled = !t.enabled;
    $('mute').classList.toggle('off', !t.enabled);
  };
  $('cam').onclick = () => {
    const t = local && local.getVideoTracks()[0];
    if (!t) return;
    t.enabled = !t.enabled;
    $('cam').classList.toggle('off', !t.enabled);
    $('local').classList.toggle('on', t.enabled);
  };
  $('flip').onclick = async () => {
    if (!local || !pc) return;
    facing = facing === 'user' ? 'environment' : 'user';
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } });
      const nt = s.getVideoTracks()[0];
      const sender = pc.getSenders().find((x) => x.track && x.track.kind === 'video');
      if (sender) await sender.replaceTrack(nt);
      local.getVideoTracks().forEach((t) => { local.removeTrack(t); t.stop(); });
      local.addTrack(nt);
      $('local').srcObject = local;
      $('local').style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
    } catch {}
  };
  window.addEventListener('pagehide', () => { if (!done && BRIDGE) { api(`/api/calls/${callId}/end`, { method: 'POST' }).catch(() => {}); return; } if (!done) navigator.sendBeacon && fetch(API + `/api/calls/${callId}/end`, { method: 'POST', keepalive: true, headers: { Authorization: 'Bearer ' + token } }).catch(() => {}); });

  start();
})();
</script>
</body>
</html>
